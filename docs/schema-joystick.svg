<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="560" fill="#ffffff"/>
  <style>
    .box { fill:#eef4fb; stroke:#2f4468; stroke-width:2; }
    .title { font-size:20px; font-weight:bold; fill:#1d2b44; }
    .h { font-size:15px; font-weight:bold; fill:#1d2b44; }
    .pin { font-size:12px; fill:#1d2b44; }
    .note { font-size:12px; fill:#555; }
    .w { stroke-width:2; fill:none; }
  </style>

  <text x="30" y="34" class="title">Joystick controller – ESP32</text>

  <!-- Joystick module -->
  <rect x="40" y="90" width="170" height="130" rx="8" class="box"/>
  <text x="56" y="114" class="h">Analog joystick</text>
  <text x="200" y="144" class="pin" text-anchor="end">VRx</text>
  <text x="200" y="174" class="pin" text-anchor="end">VRy</text>
  <text x="200" y="204" class="pin" text-anchor="end">SW (button)</text>

  <!-- Enable button -->
  <rect x="40" y="250" width="170" height="80" rx="8" class="box"/>
  <text x="56" y="274" class="h">Button with LED</text>
  <text x="200" y="294" class="pin" text-anchor="end">Button</text>
  <text x="200" y="320" class="pin" text-anchor="end">LED</text>

  <!-- Switches -->
  <rect x="40" y="360" width="170" height="90" rx="8" class="box"/>
  <text x="56" y="384" class="h">2 switches</text>
  <text x="200" y="404" class="pin" text-anchor="end">Switch L</text>
  <text x="200" y="434" class="pin" text-anchor="end">Switch R</text>

  <g class="w">
    <line x1="210" y1="140" x2="340" y2="140" stroke="#1f6fd1"/>
    <line x1="210" y1="170" x2="340" y2="170" stroke="#1f6fd1"/>
    <line x1="210" y1="200" x2="340" y2="200" stroke="#2e8b57"/>
    <line x1="210" y1="290" x2="340" y2="290" stroke="#2e8b57"/>
    <line x1="210" y1="316" x2="340" y2="316" stroke="#f9a825"/>
    <line x1="210" y1="400" x2="340" y2="400" stroke="#9e9e9e" stroke-dasharray="6 4"/>
    <line x1="210" y1="430" x2="340" y2="430" stroke="#9e9e9e" stroke-dasharray="6 4"/>
  </g>

  <!-- ESP32 -->
  <rect x="340" y="80" width="240" height="390" rx="8" class="box"/>
  <text x="356" y="104" class="h">ESP32</text>
  <g class="pin">
    <text x="350" y="144">GPIO33 (ADC)</text>
    <text x="350" y="174">GPIO32 (ADC)</text>
    <text x="350" y="204">GPIO25 (internal pull-up)</text>
    <text x="350" y="294">GPIO36 (input only)</text>
    <text x="350" y="320">GPIO27</text>
    <text x="350" y="404">GPIO35 (input only)</text>
    <text x="350" y="434">GPIO34 (input only)</text>
  </g>
  <g class="pin" text-anchor="end">
    <text x="572" y="144">GPIO14</text>
    <text x="572" y="254">GPIO5</text>
  </g>

  <!-- NeoPixel -->
  <line x1="580" y1="140" x2="660" y2="140" stroke="#6a1b9a" class="w"/>
  <text x="620" y="132" class="pin" text-anchor="middle">DIN</text>
  <rect x="660" y="112" width="120" height="56" rx="6" class="box"/>
  <text x="670" y="134" class="pin">WS2812 #0</text>
  <text x="670" y="154" class="pin">right: mode</text>
  <line x1="780" y1="140" x2="800" y2="140" stroke="#6a1b9a" class="w"/>
  <rect x="800" y="112" width="130" height="56" rx="6" class="box"/>
  <text x="810" y="134" class="pin">WS2812 #1</text>
  <text x="810" y="154" class="pin">left: WiFi</text>

  <!-- Board LED -->
  <line x1="580" y1="250" x2="660" y2="250" stroke="#2e7d32" class="w"/>
  <circle cx="670" cy="250" r="9" fill="#66bb6a" stroke="#333" stroke-width="1.2"/>
  <text x="690" y="254" class="pin">Board LED (on)</text>

  <!-- Legend -->
  <text x="620" y="320" class="h">Pixel colors</text>
  <g class="pin">
    <text x="620" y="344">#0 red: startup / connecting</text>
    <text x="620" y="364">#0 green: sending via WiFi/OSC</text>
    <text x="620" y="384">#0 blue: sending via ESP-NOW</text>
    <text x="620" y="408">#1 blinking red: connecting to WiFi</text>
    <text x="620" y="428">#1 red: no WiFi · off: WiFi ok</text>
  </g>

  <text x="40" y="500" class="note">GPIO34/35/36 have no internal pull-ups: button and switches need external resistors. In version 10 the switches are read but not evaluated.</text>
  <text x="40" y="520" class="note">Battery powered; battery type and voltage regulator are not defined in the code and are not shown.</text>
</svg>
