<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="640" fill="#ffffff"/>
  <style>
    .box { fill:#eef4fb; stroke:#2f4468; stroke-width:2; }
    .sub { fill:#ffffff; stroke:#2f4468; stroke-width:1.2; }
    .title { font-size:20px; font-weight:bold; fill:#1d2b44; }
    .h { font-size:15px; font-weight:bold; fill:#1d2b44; }
    .pin { font-size:12px; fill:#1d2b44; }
    .note { font-size:12px; fill:#555; }
    .w { stroke-width:2; fill:none; }
  </style>

  <text x="30" y="34" class="title">Crawler type 1 – ESP32-CAM with PCA9685 (motors + lights)</text>

  <!-- ESP32-CAM -->
  <rect x="40" y="80" width="220" height="280" rx="8" class="box"/>
  <text x="56" y="104" class="h">ESP32-CAM (AI-Thinker)</text>
  <rect x="60" y="120" width="110" height="56" rx="4" class="sub"/>
  <text x="72" y="143" class="pin">Camera OV2640</text>
  <text x="72" y="162" class="note">wired internally</text>
  <text x="252" y="204" class="pin" text-anchor="end">GPIO13 (SDA)</text>
  <text x="252" y="234" class="pin" text-anchor="end">GPIO14 (SCL)</text>
  <text x="56" y="280" class="note">GPIO4: flash LED (output, off)</text>
  <text x="56" y="298" class="note">GPIO12: HIGH at startup</text>
  <text x="56" y="322" class="note">Video: http://192.168.0.192/</text>
  <text x="56" y="340" class="note">Stream: Port 81 /stream</text>

  <!-- I2C -->
  <line x1="260" y1="200" x2="380" y2="200" stroke="#2e8b57" class="w"/>
  <line x1="260" y1="230" x2="380" y2="230" stroke="#1f6fd1" class="w"/>
  <text x="320" y="192" class="pin" text-anchor="middle">I²C SDA</text>
  <text x="320" y="248" class="pin" text-anchor="middle">I²C SCL</text>

  <!-- PCA9685 -->
  <rect x="380" y="80" width="200" height="460" rx="8" class="box"/>
  <text x="396" y="104" class="h">PCA9685</text>
  <text x="396" y="122" class="note">address 0x40, 100 Hz, 12 bit</text>
  <text x="390" y="204" class="pin">SDA</text>
  <text x="390" y="234" class="pin">SCL</text>
  <g class="pin" text-anchor="end">
    <text x="572" y="154">CH2</text>
    <text x="572" y="184">CH3</text>
    <text x="572" y="224">CH1</text>
    <text x="572" y="254">CH0</text>
    <text x="572" y="304">CH4</text>
    <text x="572" y="334">CH5</text>
    <text x="572" y="364">CH6</text>
    <text x="572" y="414">CH8</text>
    <text x="572" y="444">CH9</text>
    <text x="572" y="474">CH10</text>
    <text x="572" y="524">CH12</text>
  </g>

  <!-- Motor wires -->
  <g stroke="#7a4b00" class="w">
    <line x1="580" y1="150" x2="680" y2="150"/>
    <line x1="580" y1="180" x2="680" y2="180"/>
    <line x1="580" y1="220" x2="680" y2="220"/>
    <line x1="580" y1="250" x2="680" y2="250"/>
  </g>

  <!-- DRV8833 -->
  <rect x="680" y="125" width="130" height="150" rx="8" class="box"/>
  <text x="696" y="146" class="h">DRV8833</text>
  <text x="690" y="170" class="pin">IN A1</text>
  <text x="690" y="190" class="pin">IN A2</text>
  <text x="690" y="230" class="pin">IN B1</text>
  <text x="690" y="254" class="pin">IN B2</text>
  <text x="802" y="182" class="pin" text-anchor="end">OUT A</text>
  <text x="802" y="242" class="pin" text-anchor="end">OUT B</text>
  <line x1="810" y1="178" x2="862" y2="178" stroke="#7a4b00" class="w"/>
  <line x1="810" y1="238" x2="862" y2="238" stroke="#7a4b00" class="w"/>
  <circle cx="884" cy="178" r="22" fill="#fff" stroke="#2f4468" stroke-width="2"/>
  <text x="884" y="183" class="h" text-anchor="middle">M</text>
  <circle cx="884" cy="238" r="22" fill="#fff" stroke="#2f4468" stroke-width="2"/>
  <text x="884" y="243" class="h" text-anchor="middle">M</text>
  <text x="884" y="148" class="pin" text-anchor="middle">Motor 1 left</text>
  <text x="884" y="278" class="pin" text-anchor="middle">Motor 2 right</text>

  <!-- LEDs -->
  <g class="w">
    <line x1="580" y1="300" x2="660" y2="300" stroke="#c62828"/>
    <line x1="580" y1="330" x2="660" y2="330" stroke="#9e9e9e"/>
    <line x1="580" y1="360" x2="660" y2="360" stroke="#f9a825"/>
    <line x1="580" y1="410" x2="660" y2="410" stroke="#c62828"/>
    <line x1="580" y1="440" x2="660" y2="440" stroke="#9e9e9e"/>
    <line x1="580" y1="470" x2="660" y2="470" stroke="#f9a825"/>
    <line x1="580" y1="520" x2="660" y2="520" stroke="#6a1b9a"/>
  </g>
  <g stroke="#333" stroke-width="1.2">
    <circle cx="670" cy="300" r="9" fill="#e53935"/>
    <circle cx="670" cy="330" r="9" fill="#f5f5f5"/>
    <circle cx="670" cy="360" r="9" fill="#fdd835"/>
    <circle cx="670" cy="410" r="9" fill="#e53935"/>
    <circle cx="670" cy="440" r="9" fill="#f5f5f5"/>
    <circle cx="670" cy="470" r="9" fill="#fdd835"/>
    <circle cx="670" cy="520" r="9" fill="#ce93d8"/>
  </g>
  <g class="pin">
    <text x="690" y="304">red right – tail/brake light</text>
    <text x="690" y="334">white right – reversing light</text>
    <text x="690" y="364">front right – front light</text>
    <text x="690" y="414">red left – tail/brake light</text>
    <text x="690" y="444">white left – reversing light</text>
    <text x="690" y="474">front left – front light</text>
    <text x="690" y="524">"fireOut" – joystick button</text>
  </g>

  <text x="40" y="590" class="note">Type detection: if a device answers on I²C address 0x40, the crawler runs as type 1 (PCA). Each LED with series resistor.</text>
  <text x="40" y="610" class="note">Battery powered. Battery type, voltage regulator and exact DRV8833 wiring are not defined in the code and are not shown here.</text>
</svg>
